<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MOM админка</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f0e7">

  <!-- «Добавить на экран Домой» -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MOM админка">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Шрифты лежат на сайте (fonts/), к Google браузер не обращается -->
  <link rel="stylesheet" href="../fonts.css?v=1">
  <link rel="stylesheet" href="../calendar.css">
  <link rel="stylesheet" href="admin.css?v=3">
</head>
<body>
  <header class="bar">
    <button class="bar__back" id="back" type="button" hidden>‹ Назад</button>
    <h1 class="bar__title" id="title">MOM кондитер</h1>
  </header>

  <main class="view" id="view" tabindex="-1"></main>

  <!-- Окно редактирования товара -->
  <dialog class="editor" id="editor" aria-labelledby="editor-title"></dialog>

  <!-- Вопрос «Точно?» внутри страницы -->
  <dialog class="ask" id="ask" aria-labelledby="ask-text">
    <p class="ask__text" id="ask-text"></p>
    <div class="ask__actions">
      <button type="button" class="btn" id="ask-yes"></button>
      <button type="button" class="btn btn--ghost" id="ask-no"></button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../data.js?v=18"></script>
  <script src="../calendar.js"></script>
  <script src="admin.js?v=10"></script>
</body>
</html>
